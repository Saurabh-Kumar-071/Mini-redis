<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniRedis Cloud Terminal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f111a;
      color: #e0e0e0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 12px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid #232738;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      background: #1a1e2e;
      border: 1px solid #2a3048;
    }
    .status {
      font-size: 13px;
    }
    .status.connected {
      color: #4caf50;
    }
    .status.disconnected {
      color: #f44336;
    }
    #terminal {
      flex: 1;
      background: #08090f;
      border: 1px solid #232738;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    #output {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.45;
      font-size: 14px;
    }
    .cmd {
      color: #64b5f6;
      font-weight: 600;
    }
    .system {
      color: #81c784;
    }
    .error {
      color: #ef5350;
    }
    .output {
      color: #e0e0e0;
    }
    .input-bar {
      display: flex;
      align-items: center;
      border-top: 1px solid #1a1e2e;
      background: #0d0f17;
      padding: 10px 14px;
    }
    .prompt {
      color: #4caf50;
      margin-right: 10px;
      user-select: none;
      font-weight: bold;
      white-space: nowrap;
    }
    #input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <strong>MiniRedis Cloud Terminal</strong>
      <span class="badge">Isolated Multi-Tenant</span>
    </div>
    <div class="header-right">
      <div>Session: <span id="userBadge" style="color: #ffb74d; font-weight: bold;">Unauthenticated</span></div>
      <div id="status" class="status disconnected">Disconnected</div>
    </div>
  </header>

  <div id="terminal">
    <div id="output"></div>
    <div class="input-bar">
      <span class="prompt" id="promptSpan">MiniRedis (unauthenticated)&gt;</span>
      <input type="text" id="input" autocomplete="off" autofocus placeholder="Type command (e.g. REGISTER, AUTH, HELP)..." />
    </div>
  </div>

  <script>
    const output = document.getElementById('output');
    const input = document.getElementById('input');
    const statusEl = document.getElementById('status');
    const promptSpan = document.getElementById('promptSpan');
    const userBadge = document.getElementById('userBadge');

    let currentUser = null;
    const history = [];
    let historyIdx = 0;
    let socket = null;
    let reconnectTimer = null;

    function getPromptText() {
      return currentUser ? `MiniRedis (${currentUser})>` : `MiniRedis (unauthenticated)>`;
    }

    function updateUIState() {
      if (currentUser) {
        userBadge.textContent = currentUser;
        userBadge.style.color = '#4caf50';
        promptSpan.textContent = `${getPromptText()} `;
        promptSpan.style.color = '#4caf50';
      } else {
        userBadge.textContent = 'Unauthenticated';
        userBadge.style.color = '#ffb74d';
        promptSpan.textContent = `${getPromptText()} `;
        promptSpan.style.color = '#ffb74d';
      }
    }

    function connect() {
      if (reconnectTimer) clearTimeout(reconnectTimer);
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      socket = new WebSocket(`${protocol}//${window.location.host}`);

      socket.onopen = () => {
        statusEl.textContent = 'Connected';
        statusEl.className = 'status connected';
      };

      socket.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'auth_success') {
            currentUser = msg.user;
            updateUIState();
            appendOutput(msg.data, 'system');
          } else if (msg.type === 'logout') {
            currentUser = null;
            updateUIState();
            appendOutput(msg.data, 'system');
          } else {
            appendOutput(msg.data, msg.type);
          }
        } catch (e) {
          appendOutput(event.data, 'output');
        }
      };

      socket.onclose = () => {
        statusEl.textContent = 'Disconnected';
        statusEl.className = 'status disconnected';
        appendOutput('\n[Connection closed. Reconnecting in 3s...]\n', 'error');
        currentUser = null;
        updateUIState();
        reconnectTimer = setTimeout(connect, 3000);
      };

      socket.onerror = () => {
        socket.close();
      };
    }

    function appendOutput(text, type = '') {
      const span = document.createElement('span');
      if (type) span.className = type;
      span.textContent = text;
      output.appendChild(span);
      output.scrollTop = output.scrollHeight;
    }

    function sendCommand() {
      const cmd = input.value.trim();
      if (!cmd) return;

      if (cmd.toLowerCase() === 'clear') {
        output.innerHTML = '';
        input.value = '';
        return;
      }

      appendOutput(`${getPromptText()} ${cmd}\n`, 'cmd');

      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(cmd);
      } else {
        appendOutput('[Error: Socket not connected]\n', 'error');
      }

      history.push(cmd);
      historyIdx = history.length;
      input.value = '';
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        sendCommand();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (historyIdx > 0) {
          historyIdx--;
          input.value = history[historyIdx];
        }
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (historyIdx < history.length - 1) {
          historyIdx++;
          input.value = history[historyIdx];
        } else {
          historyIdx = history.length;
          input.value = '';
        }
      }
    });

    document.getElementById('terminal').addEventListener('click', () => {
      input.focus();
    });

    updateUIState();
    connect();
  </script>
</body>
</html>
