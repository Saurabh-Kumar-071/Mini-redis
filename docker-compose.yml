services:
  miniredis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miniredis-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # Bind to localhost only — not exposed to internet
    volumes:
      - ./data:/app/data
    env_file:
      - .env                    # Loads MINIREDIS_PASSWORD from .env file
